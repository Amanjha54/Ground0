###############################################
# MediaMTX Configuration for Ground0 Gateway
###############################################

# General
logLevel: info
logDestinations: [stdout]

# RTSP server
rtsp: yes
protocols: [tcp]
encryption: "no"
rtspAddress: :8554
rtspsAddress: :8322

# WebRTC server (Sub-second latency playback in browser)
webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcServerKey: ""
webrtcServerCert: ""
webrtcAllowOrigins: ["*"]

# HLS server (fallback)
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: no

# Paths (Sample authorized municipal streams)
paths:
  all_others:
    # Disable automatic publishing from untrusted clients
    publishUser: ""
    publishPass: ""

  cam01_market_7th:
    source: publisher
    sourceOnDemand: no

  cam02_mission_culvert:
    source: publisher
    sourceOnDemand: no
